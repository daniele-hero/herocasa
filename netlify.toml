[build]
  command = "npm run build"

[build.environment]
  # @netlify/plugin-nextjs (Next.js Runtime v5) requires Node 22+.
  NODE_VERSION = "22"

# Official Next.js runtime for Netlify — handles SSR, the next-intl
# middleware (via Netlify Edge Functions), image optimization and static
# assets automatically. Do NOT set a manual `publish` directory: the plugin
# manages routing itself and a manual publish dir will break locale routing.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/immobili/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
